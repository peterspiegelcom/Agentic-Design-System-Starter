id: STORY-042
story: >
  Als Jugendliche:r will ich verstehen, warum ein Ergebnis über mich
  entsteht, damit ich ihm glauben oder widersprechen kann.
evidenz: [I-3, R-4]
dimension: Selbstbeschreibung
verhalten:
  - Wenn ein Ergebnis angezeigt wird, soll das System eine aufklappbare
    Herleitung bieten ("… steht hier, weil").
  - Wenn ein:e Nutzer:in widerspricht, soll das System den Widerspruch
    erfassen und am Ergebnis markieren.
zustaende: [leer, laedt, fehler, herleitung-zu, herleitung-auf]
nicht_funktional:
  a11y: WCAG 2.1 AA — Herleitung per Tastatur erreichbar, Fokusreihenfolge definiert
  datenschutz: Widerspruch ohne personenbezogene Daten speicherbar
akzeptanz:
  - |
    Given ich bin auf der Profilseite
    When ich an einer Kompetenz auf "Warum?" tippe
    Then sehe ich die Herleitung
    And ich kann der Einschätzung widersprechen
ui: [Disclosure, Button/ghost, color/brand/primary, radius/pill]
status: draft
sicherheit: hoch
