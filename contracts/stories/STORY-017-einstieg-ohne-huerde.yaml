id: STORY-017
story: >
  Als Jugendliche:r will ich ohne fremde Hilfe starten können, damit meine
  Teilnahme nicht an Login, Lesen oder Sprache scheitert.
evidenz: [I-1, R-1, R-2]
dimension: Zugaenglichkeit
verhalten:
  - Wenn der Einstieg beginnt, soll das System Zugang per Code oder QR
    ermöglichen (kein Passwort).
  - Wenn Text angezeigt wird, soll das System eine Vorlesefunktion und
    skalierbare Schrift anbieten.
zustaende: [einstieg, code-eingabe, vorlesen-aktiv, fehler]
nicht_funktional:
  a11y: WCAG 2.1 AA — bedienbar ohne Lesen; Trefferflächen >= 44px
akzeptanz:
  - |
    Given ich öffne die Anwendung mit einem Code
    When ich den Code eingebe
    Then bin ich eingestiegen, ohne mich anzumelden
  - |
    Given eine Seite mit Text
    When ich die Vorlesefunktion starte
    Then wird der Text vorgelesen
status: draft
sicherheit: hoch
